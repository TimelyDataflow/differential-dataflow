name: "Test Suite"
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  msrv:
    name: Determine MSRV
    runs-on: ubuntu-latest
    outputs:
      msrv: ${{ steps.msrv.outputs.msrv }}
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "msrv=$(grep '^rust-version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

  test:
    needs: msrv
    strategy:
      matrix:
        os:
          - ubuntu
          - macos
# Linking fails on Windows.
#           - windows
        toolchain:
          - stable
          - ${{ needs.msrv.outputs.msrv }}
    name: cargo test on ${{ matrix.os }}, rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Cargo test
        run: cargo test --workspace --all-targets
      - name: Cargo doc test
        run: cargo test --doc

  # The server-backed suites and the explanation sweeps, once, against a release build: they
  # check answers, not timings, and a debug server made them most of the suite's time. The
  # matrix above keeps the debug build's assertions through `cargo test`.
  ldbc:
    name: LDBC and explanation suites (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build the release server
        run: cargo build --release -p ddir-server
      # One small server-backed workload; no data download or timing thresholds.
      - name: LDBC-derived correctness smoke
        run: |
          for workers in 1 4; do
            python3 interactive/server/bench/ldbc/run.py --server target/release/ddir_server \
              --workers "$workers" --rounds 1 --warmup 0 --batch-size 9 --changes 1
          done
      - name: Complete SNB read catalogue
        run: |
          python3 interactive/server/bench/ldbc/test_harness.py
          python3 interactive/server/bench/ldbc/test_snb.py
          python3 interactive/server/bench/ldbc/test_updates.py
          for workers in 1 4; do
            python3 interactive/server/bench/ldbc/test_frames.py --server target/release/ddir_server \
              --workers "$workers"
            python3 interactive/server/bench/ldbc/suite.py --server target/release/ddir_server \
              --workers "$workers" --rounds 1 --warmup 0
          done
          python3 interactive/server/bench/ldbc/suite.py --server target/release/ddir_server \
            --mode maintained --workers 4 --rounds 1 --warmup 0
      - name: LDBC weighted aggregates, bounded ranking and memory profiler
        run: |
          python3 interactive/server/bench/ldbc/test_aggregates.py --server target/release/ddir_server \
            --output /tmp/ldbc-aggregates
          python3 interactive/server/bench/ldbc/test_topk.py --server target/release/ddir_server \
            --output /tmp/ldbc-topk
          python3 interactive/server/bench/ldbc/test_memory_profile.py --server target/release/ddir_server \
            --output /tmp/ldbc-memory-profile
      - name: SNB update streams
        run: |
          python3 interactive/server/bench/ldbc/test_update_stream.py \
            --server target/release/ddir_server --workers 4 \
            --output /tmp/ldbc-update-stream-4
          python3 interactive/server/bench/ldbc/test_update_stream.py \
            --server target/release/ddir_server --workers 4 --check-mode replay \
            --output /tmp/ldbc-update-stream-replay
      - name: Authored LDBC plans agree with the generated plans
        run: |
          python3 interactive/server/bench/ldbc/authored/check.py --server target/release/ddir_server \
            --fixture --workers 4 --reps 1 --warmup 0 --output /tmp/ldbc-authored-check
      # The explanation suite's heavier sweeps (soundness regression, fuzz)
      # are #[ignore]d for local debug runs but must gate merges. The metric
      # report is skipped (it prints, it does not assert).
      - name: Explanation suite (release, incl. ignored)
        run: cargo test --release -p interactive --test explain -- --include-ignored --skip report_demand_excess

  # Check for clippy warnings
  clippy:
    name: Cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets
        env:
          RUSTFLAGS: "" # Don't make test fail on clippy
