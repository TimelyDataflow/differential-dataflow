[package]
name = "interactive"
version = "0.1.0"
authors = ["Frank McSherry <fmcsherry@me.com>"]
license = "MIT"
edition.workspace = true
rust-version.workspace = true
description = "DD IR: an interpreted intermediate representation for differential dataflow"
publish = false

[lints]
workspace = true

[dependencies]
columnar = { workspace = true }
# The columnar kernels for the interpreted backend, pinned by git rev.
corgi = { git = "https://github.com/frankmcsherry/WIP", rev = "73a0f64ca6b2942c0c407db19c45473b30ecbda4", features = ["serde"] }
differential-dataflow = { workspace = true }
differential-dogs3 = { path = "../dogsdogsdogs", default-features = false }
serde = { version = "1.0", features = ["derive"] }
smallvec = "1.15.1"
timely = { workspace = true }

[dev-dependencies]
diagnostics = { path = "../diagnostics" }

[features]
default = ["timely/getopts"]
